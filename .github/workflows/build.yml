name: Build APKs

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APKs
        run: ./gradlew :protocol:test :mobile:testDebugUnitTest :tv:testDebugUnitTest :mobile:assembleDebug :tv:assembleDebug --no-daemon

      - name: Upload mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beamcast-mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beamcast-tv-debug
          path: tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
